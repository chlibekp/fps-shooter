# Release packaging. See Documentation/RELEASES.md.
#
# On a published GitHub release (or a manual run for an existing release tag):
#  * `package` builds the dedicated server, lobby, bot and the C++ CLI client
#    on Linux, Windows and macOS (Apple Silicon), packs them with the shared
#    definitions and run scripts, and smoke-tests each archive by starting it.
#  * `publish` uploads the archives plus SHA256SUMS to the release; it only
#    runs when every platform's package and smoke test passed.
#  * `game` (game.yml) builds the playable download for Linux, Windows and
#    macOS on standard runners - Godot client + local server + Play /
#    Practice launchers - and smoke-tests the Linux one with the real game.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build and upload, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (arm64). No Intel macOS build: the
        # remaining Intel macOS runner images are being retired.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Build and package
        id: pkg
        shell: bash
        run: |
          Scripts/package_release.sh "$TAG" Dist/release | tee package.log
          echo "archive=$(tail -n 1 package.log)" >> "$GITHUB_OUTPUT"

      - name: Smoke test the archive (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: Scripts/smoke_test_package.sh "${{ steps.pkg.outputs.archive }}"

      - name: Smoke test the archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Get-ChildItem Dist\release\*.zip | Select-Object -First 1
          pwsh -NoProfile -File Scripts\smoke_test_package.ps1 $archive.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.os }}
          path: |
            Dist/release/*.tar.gz
            Dist/release/*.zip
          if-no-files-found: error
          retention-days: 7

  game:
    name: Playable game
    uses: ./.github/workflows/game.yml
    with:
      version: ${{ github.event.release.tag_name || inputs.tag }}
      ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}

  publish:
    name: Upload to the release
    needs: [package, game]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: game-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum tfps-* TacticalFPS-* > SHA256SUMS
          cat SHA256SUMS
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
