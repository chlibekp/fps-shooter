# Builds the playable Linux game download on a free GitHub-hosted runner,
# using Epic's official Unreal Engine container image (Linux builds only:
# Unreal cannot build Windows or macOS games on Linux).
#
# 🔒 UNTESTED: written without access to the Unreal images; the Unreal client
# has never been compiled by UnrealBuildTool, so the first runs are expected
# to fail with compile errors to fix. Run it by hand (Actions > Unreal Linux
# build > Run workflow) to iterate; logs and the package are kept as artifacts.
#
# One-time setup (free), see Documentation/RELEASES.md:
#  1. Link your GitHub account to an Epic Games account and accept the
#     Unreal Engine EULA (unrealengine.com > Account > Apps and Accounts).
#     Epic then invites you to the EpicGames GitHub organisation; accept it.
#  2. Create a classic personal access token with the read:packages scope and
#     save it as the repository secret EPIC_GHCR_TOKEN (if the token belongs
#     to another GitHub user than the repository owner, also set the
#     repository variable EPIC_GHCR_USER to that user name).
#  3. To build on every release, set the repository variable
#     TFPS_UE_CONTAINER to 'true'.
# Optional repository variable TFPS_UE_IMAGE overrides the image
# (default ghcr.io/epicgames/unreal-engine:dev-slim-5.4).
name: Unreal Linux build

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and upload to (empty = artifact only)
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        type: string
        default: main

permissions:
  contents: read

jobs:
  build:
    name: Unreal client (Linux, container)
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      IMAGE: ${{ vars.TFPS_UE_IMAGE || 'ghcr.io/epicgames/unreal-engine:dev-slim-5.4' }}
      GHCR_USER: ${{ vars.EPIC_GHCR_USER || github.repository_owner }}
      GHCR_TOKEN: ${{ secrets.EPIC_GHCR_TOKEN }}
    steps:
      - name: Check the Epic registry token
        run: |
          if [[ -z "$GHCR_TOKEN" ]]; then
            echo "::error::Repository secret EPIC_GHCR_TOKEN is not set. Setup: Documentation/RELEASES.md (Unreal client, free container build)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || inputs.ref || github.ref }}

      - name: Free disk space
        run: |
          df -h / /mnt || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/share/powershell /usr/share/swift /opt/microsoft /opt/google /usr/lib/jvm \
            /usr/local/julia* /opt/az /usr/local/share/chromium || true
          sudo docker image prune -af || true
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile /swapfile || true
          # Put Docker's image store on whichever disk has more room.
          ROOT_FREE=$(df --output=avail -k / | tail -n 1)
          MNT_FREE=$(df --output=avail -k /mnt | tail -n 1 || echo 0)
          if (( MNT_FREE > ROOT_FREE )); then
            sudo systemctl stop docker docker.socket || true
            sudo mkdir -p /mnt/docker
            echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
            sudo systemctl start docker
          fi
          df -h / /mnt || true
          docker info --format 'docker root: {{.DockerRootDir}}'

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the server, lobby and bots
        run: cargo build --release -p tfps-server -p tfps-lobby -p tfps-devclient

      - name: Pull the Unreal Engine image
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker pull "$IMAGE"
          docker logout ghcr.io
          df -h / /mnt || true

      - name: Build, cook and package the client (Linux, Shipping)
        run: |
          set -o pipefail
          bash -c 'source Scripts/common.sh; sync_definitions'
          mkdir -p Dist/client-Linux Logs
          # The image runs as its own user; let it write into the checkout.
          chmod -R a+rwX "$GITHUB_WORKSPACE"
          docker run --rm -v "$GITHUB_WORKSPACE:/project" -w /project "$IMAGE" bash -c '
            set -euo pipefail
            UE=/home/ue4/UnrealEngine
            "$UE/Engine/Build/BatchFiles/RunUAT.sh" BuildCookRun \
              -project=/project/Client/TacticalFPS.uproject -noP4 -unattended -utf8output \
              -platform=Linux -clientconfig=Shipping \
              -build -cook -stage -pak -archive -archivedirectory=/project/Dist/client-Linux
          ' 2>&1 | tee Logs/unreal-build.log
          docker image rm "$IMAGE" || true

      - name: Assemble the player download
        id: game
        run: |
          ARCHIVE=$(Scripts/package_game.sh "${TAG:-dev-${GITHUB_SHA::8}}" Linux Dist/client-Linux Dist/game | tail -n 1)
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          (cd "$(dirname "$ARCHIVE")" && sha256sum "$(basename "$ARCHIVE")" > "$(basename "$ARCHIVE").sha256")
          ls -lh Dist/game

      - name: Smoke test - the real client joins a practice match (headless)
        env:
          TFPS_CLIENT_ARGS: -nullrhi -nosound -unattended
        run: Scripts/smoke_test_game.sh "${{ steps.game.outputs.archive }}" 180

      - name: Keep logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unreal-linux-logs
          path: |
            Logs/
            Client/Saved/Logs/
          if-no-files-found: ignore

      - name: Keep the package (manual runs)
        if: inputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: TacticalFPS-linux-x86_64
          path: ${{ steps.game.outputs.archive }}
          retention-days: 7

      - name: Upload to the release
        if: inputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "${{ steps.game.outputs.archive }}" "${{ steps.game.outputs.archive }}.sha256" --clobber --repo "$GITHUB_REPOSITORY"
