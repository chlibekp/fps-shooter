[workspace]
resolver = "2"
members = [
    "Shared/Simulation/rust",
    # "Shared/Protocol/rust",
    # "Server",
    # "Tools/DevClient",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
rust-version = "1.80"

[workspace.dependencies]
tfps-sim = { path = "Shared/Simulation/rust" }
tfps-protocol = { path = "Shared/Protocol/rust" }
tfps-devclient = { path = "Tools/DevClient" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive"] }
rand = "0.9"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
