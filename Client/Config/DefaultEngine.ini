[/Script/EngineSettings.GameMapsSettings]
; No authored .umap exists yet: the game boots into the engine's empty Entry
; map and ATfpsGameMode builds the environment from Shared/Definitions/maps.
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/TacticalFPS.TfpsGameMode

[/Script/Engine.Engine]
; Gameplay networking is our own UDP protocol to the Rust server.
bSmoothFrameRate=False

[/Script/Engine.RendererSettings]
; Lumen GI + reflections, virtual shadow maps. Lumen/Nanite availability per
; platform is documented in Documentation/PLATFORMS.md; scalability settings
; fall back to screen-space techniques where unsupported.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.Lumen.TraceMeshSDFs=1
r.Nanite.ProjectEnabled=True
r.AntiAliasingMethod=4
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.MotionBlur=False
r.SkinCache.CompileShaders=True
r.RayTracing=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
; Linux (Vulkan) and macOS (Metal) use the engine's default shader formats.
